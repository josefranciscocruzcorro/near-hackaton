# Host nginx site for every tenant subdomain (ADR-0006): <slug>.tesorero.gesco.ec → nearhklive (127.0.0.1:32081).
# The apex tesorero.gesco.ec keeps its own site (landing). Wildcard certificate via DNS-01 (renew with certbot --manual --preferred-challenges dns).
server {
    listen 80;
    listen [::]:80;
    server_name *.tesorero.gesco.ec;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.tesorero.gesco.ec;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wildcard.tesorero.gesco.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.tesorero.gesco.ec/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:32081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
    }
}
