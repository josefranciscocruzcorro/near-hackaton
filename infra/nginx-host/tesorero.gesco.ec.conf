# Host nginx site for Tesorero. Stack lives in /root/nearhklive; its internal nginx listens on 127.0.0.1:32081.
# Install: copy to /etc/nginx/sites-available/tesorero.gesco.ec, symlink into sites-enabled, `nginx -t`, reload,
# then `certbot --nginx -d tesorero.gesco.ec` adds the TLS server block (see docs/skills/SKILLS.md S-05).
server {
    listen 80;
    listen [::]:80;
    server_name tesorero.gesco.ec;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:32081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
    }
}
