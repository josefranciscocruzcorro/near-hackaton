# nearhk_nginx — internal reverse proxy + static PWA.
# Host nginx (TLS, near.gesco.ec) → 127.0.0.1:32080 → this container.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types { application/manifest+json webmanifest; }

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/json application/javascript application/manifest+json image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # The host nginx is the only client; trust its forwarded address.
    set_real_ip_from 10.88.0.0/16;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # One Cache-Control per path, set at server level. (add_header inside a location would
    # silently drop the server-level security headers, so locations never use add_header.)
    map $uri $cache_control {
        default                                   "no-cache";
        ~^/assets/                                "public, max-age=31536000, immutable";
        ~^/api/                                   "no-store";
        ~^/media/                                 "public, max-age=86400";
        /sw.js                                    "no-cache, no-store, must-revalidate";
    }

    upstream api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $cache_control always;
        # connect/frame: NEAR Wallet Selector (owner actions signed by the owner's wallet, ADR-0007): FastNEAR RPC, HOT/HERE relay and connector.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://free.rpc.fastnear.com https://h4n.app wss://h4n.app; frame-src https://my.herewallet.app; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://api;
            access_log off;
        }

        # Hangfire dashboard is local-only (SSH tunnel to the API container).
        location /hangfire { return 404; }

        # Service worker, app shell and manifest are revalidated on every load (see $cache_control),
        # so a new release is picked up immediately; fingerprinted /assets/ are cached forever.
        location /assets/ {
            try_files $uri =404;
        }

        # Landing videos and posters live outside the app bundle (mounted read-only, never cached by the SW).
        location /media/ {
            alias /usr/share/nginx/media/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
